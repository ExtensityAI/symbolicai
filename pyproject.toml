[build-system]
requires = ["uv_build>=0.9.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true
required-version = ">=0.9.17"

[project]
name = "symbolicai"
version = "1.18.0"
authors = [
    { name = "Marius-Constantin Dinu", email = "marius@extensity.ai" },
    { name = "Leoveanu-Condrei Claudiu", email = "leo@extensity.ai" },
]
description = "Explicit typed runtimes for OpenAI, Cerebras, and DeepSeek language models and OpenAI embeddings"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["large language models", "embeddings", "openai", "cerebras", "deepseek"]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.26.4,<=2.1.3",
    "pydantic>=2.8.2",
    "jinja2>=3.1.0",
    "python-box>=7.1.1",
    "httpx>=0.28.1",
]

[tool.uv.build-backend]
module-name = "symai"
module-root = ""
source-exclude = [
    "/.github",
    "/artifacts",
    "/build",
    "/dist",
    "/docs",
    "/examples",
    "/pytest.ini",
    "/ruff.toml",
    "/tests",
    "/uv.lock",
    "*.egg-info",
    "*.pyc",
    ".DS_Store",
    "__pycache__",
]

[dependency-groups]
dev = [
    "ruff>=0.14.4",
    "pytest>=8.3.1",
    "pytest-xdist>=3.6.0",
    "pyright>=1.1.411",
]

[tool.pyright]
include = ["symai", "tests/typecheck"]
pythonVersion = "3.12"
reportImplicitOverride = "warning"
reportMatchNotExhaustive = "warning"
reportUnnecessaryTypeIgnoreComment = "error"

[project.urls]
"Homepage" = "https://extensity.ai"
"GitHub" = "https://github.com/ExtensityAI/symbolicai"

