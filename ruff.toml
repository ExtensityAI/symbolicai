exclude = [
    ".codex",
    ".symai",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "scripts",
]

line-length = 100
indent-width = 4
target-version = "py312"

[lint]
# Rules URL: https://docs.astral.sh/ruff/rules
select = [
  "F","E4","E7","E9",
  "I","TID252","UP","B","SIM","C4","A","ARG","ISC","RET","RSE",
  "G","LOG","TC","PTH","EM","C90",
  "PLE","PLC","PLW",
  "RUF","T10","T20"
]
ignore = [
  "B028", # no explicit stacklevel; enable if you rely on warnings for users
  "PLW0603", # global statement discouraged; often noisy in legacy code
  "A002", # argument-shadowing-builtin
  "C901", # better to handle this manually case by case
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
# Lazy provider loading imports inside functions on purpose (import-on-demand).
"symai/loading.py" = ["PLC0415"]
"symai/providers/*/loading.py" = ["PLC0415"]
"symai/providers/*/__init__.py" = ["PLC0415"]
# ops.text intentionally exposes builtin-named operations (`filter`, `map`) as its public surface;
# ops `__all__` tuples follow the design (SYMBOL_REDESIGN §5) order, not alphabetical.
"symai/ops/*.py" = ["A001", "RUF022"]
# Tests import inside functions on purpose: guard tests assert on import side effects and
# module identity, which a top-level import would establish before the test runs.
# Test doubles implement engine protocols, so they must accept arguments they ignore
# (ARG002) and may raise inline messages (EM101) without the msg-variable indirection.
# TC001 is not applicable: this project does not use TYPE_CHECKING guards.
"tests/*" = ["PLC0415", "ARG002", "EM101", "TC001"]

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
