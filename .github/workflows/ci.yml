name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - refactor/engine-redesign

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --dev
      - run: uv run ruff check symai
      - run: uv run pyright
      - run: uv run pytest -q
